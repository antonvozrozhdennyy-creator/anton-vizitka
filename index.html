    --lime-soft:#F5FFC9;
    --paper:#F5F5EF;

    --line:rgba(245,245,239,0.14);

  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;

      radial-gradient(circle at 20% 15%, rgba(199,242,61,0.08), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(199,242,61,0.05), transparent 40%),
      var(--bg);
    color:var(--paper);
    padding:32px 16px;
  }

    background:var(--panel);
    border:1px solid var(--line);
    border-radius:22px;
    padding:44px 30px 34px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }

  .card::after{
    content:"";
    position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 38%, rgba(14,15,12,0.55) 0%, rgba(14,15,12,0.88) 62%, rgba(14,15,12,0.97) 100%);
    z-index:0;
  }
  .card > *{position:relative;z-index:1;}
  .avatar{
    width:96px;height:96px;border-radius:50%;
    margin:0 auto 24px;
    background:linear-gradient(135deg, var(--lime), var(--lime-dark));
    color:#12140C;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:2.2rem;
    letter-spacing:-0.02em;
    box-shadow:0 0 0 4px rgba(199,242,61,0.12), 0 8px 24px rgba(199,242,61,0.18);
  }
  h1{
    font-weight:800;
    font-size:clamp(1.6rem, 6vw, 2rem);
    margin:0 0 4px;
    line-height:1.15;
    letter-spacing:-0.01em;
    background:linear-gradient(100deg, var(--lime-dark) 0%, var(--lime-soft) 35%, var(--lime) 60%, var(--lime-soft) 85%);
    background-size:220% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:shine 5s linear infinite;
    filter:drop-shadow(0 0 14px rgba(199,242,61,0.35));
  }
  @keyframes shine{
    to{background-position:-220% center;}
  }
  .desc{
    color:var(--ink-soft);font-size:0.96rem;line-height:1.5;
    margin:14px auto 28px;max-width:30ch;
  }

  .cta{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;padding:16px;border-radius:12px;margin-bottom:18px;
    background:var(--lime);color:#12140C;
    font-weight:800;font-size:1.02rem;
    text-decoration:none;border:none;position:relative;
    box-shadow:0 0 0 0 rgba(199,242,61,0.5);
    animation:pulse 2.4s ease-out infinite;
    transition:transform .15s ease;
  }
  .cta:hover{transform:translateY(-2px) scale(1.015);}
  .cta:active{transform:translateY(0) scale(0.98);}
  .cta svg{width:21px;height:21px;flex-shrink:0;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(199,242,61,0.45);}
    70%{box-shadow:0 0 0 14px rgba(199,242,61,0);}
    100%{box-shadow:0 0 0 0 rgba(199,242,61,0);}
  }

  .links{display:flex;flex-direction:column;gap:11px;}
  .link-btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
