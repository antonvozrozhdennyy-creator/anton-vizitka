<style>
  :root{
    --bg:#0E0F0C;
    --panel:#1A1C13;
    --lime:#C7F23D;
    --lime-dark:#9FCB1F;
    --paper:#F5F5EF;
    --ink-soft:rgba(245,245,239,0.68);
    --ink-faint:rgba(245,245,239,0.45);
    --line:rgba(245,245,239,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    font-family:'Manrope',sans-serif;
    background:var(--bg);
    color:var(--paper);
    padding:24px;
  }
  .card{
    width:100%;max-width:400px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:40px 32px;
    text-align:center;
  }
  .avatar{
    width:92px;height:92px;border-radius:50%;
    margin:0 auto 22px;
    background:var(--lime);
    color:#12140C;
    display:flex;align-items:center;justify-content:center;
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:800;font-size:2.1rem;
  }
  h1{
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:800;font-size:1.7rem;margin:0 0 6px;color:var(--paper);
  }
  .role{
    color:var(--lime);font-weight:700;font-size:0.95rem;margin-bottom:6px;
  }
  .desc{
    color:var(--ink-soft);font-size:0.92rem;margin:0 0 30px;
  }
  .links{display:flex;flex-direction:column;gap:12px;}
  .link-btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    padding:14px;border-radius:10px;
    text-decoration:none;font-weight:700;font-size:0.96rem;
    border:1px solid var(--line);color:var(--paper);
    transition:border-color .15s, background .15s;
  }
  .link-btn:hover{border-color:var(--lime);background:rgba(199,242,61,0.06);}
  .link-btn.primary{
    background:var(--lime);color:#12140C;border-color:var(--lime);
  }
  .link-btn.primary:hover{background:var(--lime-dark);}
  .link-btn svg{width:20px;height:20px;flex-shrink:0;}
  .footer-note{
    margin-top:28px;font-size:0.78rem;color:var(--ink-faint);
  }
  .footer-note a{color:var(--ink-faint);}
</style>
