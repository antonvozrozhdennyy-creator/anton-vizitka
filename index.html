<style>
  :root{

    --panel-2:#1F220F;

    --lime-dark:#9FCB1F;
    --lime-soft:#F5FFC9;
    --paper:#F5F5EF;
    --ink-soft:rgba(245,245,239,0.68);
    --ink-faint:rgba(245,245,239,0.45);
    --line:rgba(245,245,239,0.14);

  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(199,242,61,0.08), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(199,242,61,0.05), transparent 40%),
      var(--bg);
    color:var(--paper);
    padding:32px 16px;
  }
  .card{
    width:100%;max-width:420px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:22px;
    padding:44px 30px 34px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }

  .card::after{
    content:"";
    position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 40%, rgba(14,15,12,0.35) 0%, rgba(14,15,12,0.68) 58%, rgba(14,15,12,0.88) 100%);
    z-index:0;
  }
  .card > *{position:relative;z-index:1;}

  .avatar{
    width:96px;height:96px;border-radius:50%;
    margin:0 auto 24px;
    background:linear-gradient(135deg, var(--lime), var(--lime-dark));
    color:#12140C;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:2.2rem;
    letter-spacing:-0.02em;
    box-shadow:0 0 0 4px rgba(199,242,61,0.12), 0 8px 24px rgba(199,242,61,0.18);
  }
  h1{
    font-weight:800;
    font-size:clamp(1.6rem, 6vw, 2rem);
    margin:0 0 4px;
    line-height:1.15;
    letter-spacing:-0.01em;
    background:linear-gradient(100deg, var(--lime-dark) 0%, var(--lime-soft) 35%, var(--lime) 60%, var(--lime-soft) 85%);
    background-size:220% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:shine 5s linear infinite;
    filter:drop-shadow(0 0 14px rgba(199,242,61,0.35));
  }
  @keyframes shine{
    to{background-position:-220% center;}
  }
  .desc{
    color:var(--ink-soft);font-size:0.96rem;line-height:1.5;
    margin:14px auto 28px;max-width:30ch;
  }

  .cta{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;padding:16px;border-radius:12px;margin-bottom:18px;
    background:var(--lime);color:#12140C;
    font-weight:800;font-size:1.02rem;
    text-decoration:none;border:none;position:relative;
    box-shadow:0 0 0 0 rgba(199,242,61,0.5);
    animation:pulse 2.4s ease-out infinite;
    transition:transform .15s ease;
  }
  .cta:hover{transform:translateY(-2px) scale(1.015);}
  .cta:active{transform:translateY(0) scale(0.98);}
  .cta svg{width:21px;height:21px;flex-shrink:0;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(199,242,61,0.45);}
    70%{box-shadow:0 0 0 14px rgba(199,242,61,0);}
    100%{box-shadow:0 0 0 0 rgba(199,242,61,0);}
  }

  .links{display:flex;flex-direction:column;gap:11px;}
  .link-btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    padding:14px;border-radius:12px;
    text-decoration:none;font-weight:700;font-size:0.95rem;
    border:1px solid var(--line);color:var(--paper);
    background:var(--panel-2);
    position:relative;overflow:hidden;
    transition:border-color .2s ease, transform .2s ease, background .2s ease, color .2s ease;
  }
  .link-btn svg{
    width:20px;height:20px;flex-shrink:0;
    transition:transform .3s ease, color .2s ease;
    color:var(--ink-soft);
  }
  .link-btn::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(120deg, transparent, rgba(199,242,61,0.14), transparent);
    transform:translateX(-120%);
    transition:transform .5s ease;
  }
  .link-btn:hover{
    border-color:var(--lime);
    transform:translateY(-3px);
    background:rgba(199,242,61,0.06);
  }
  .link-btn:hover::before{transform:translateX(120%);}
  .link-btn:hover svg{color:var(--lime);transform:scale(1.12) rotate(-4deg);}
  .link-btn:active{transform:translateY(-1px) scale(0.98);}

  .footer-note{
    margin-top:30px;font-size:0.78rem;color:var(--ink-faint);
  }

  @media (max-width:400px){
    .card{padding:36px 22px 28px;border-radius:18px;}
    .avatar{width:84px;height:84px;font-size:1.9rem;}
  }
</style>
</head>
